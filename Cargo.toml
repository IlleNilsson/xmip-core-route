# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-route"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-route"
description = "Xmip publication, subscription matching and dispatch."

[dependencies]
serde = { version = "1", features = ["derive"] }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
# A route technology reads the Message itself — content, sections, generation —
# so the source trait takes one (ADR-0046).
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }

[dev-dependencies]
toml = "0.9"
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
