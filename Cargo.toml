[package]
name = "xmip-core-route"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-route"
description = "Xmip publication, subscription matching and dispatch."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
context = { workspace = true }
xcore = { workspace = true }
# A route technology reads the Message itself — content, sections, generation —
# so the source trait takes one (ADR-0046).
message = { workspace = true }
# A filter is one line of Xmip's expression language, compiled once and
# decided from its tree; the language is a capability of its own, which
# routing forming a Subscription uses directly (ADR-0066, amendment
# 2026-11-28).
expression = { workspace = true }
# The content a Message's Stream is parsed into once, which every source
# reads (ADR-0046, amendment 2026-09-27).
path = { workspace = true }

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
toml = "1.2.1"
# The timing program's figure, the fastest of five over its rounds, read
# once for the estate (`xcore::latency`); for the tests only.
xcore = { workspace = true, features = ["test-support"] }

[lints]
